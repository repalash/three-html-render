<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - materials - html texture (legacy three.js 0.164)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			/* three.js examples/main.css (inlined — not shipped in the npm package) */
			body {
				margin: 0;
				background-color: #ffffff;
				color: #fff;
				font-family: Monospace;
				font-size: 13px;
				line-height: 24px;
				overscroll-behavior: none;
			}
			a { color: #ff0; text-decoration: none; }
			a:hover { text-decoration: underline; }
			#info {
				position: absolute;
				top: 0px;
				width: 100%;
				padding: 10px;
				box-sizing: border-box;
				text-align: center;
				user-select: none;
				pointer-events: none;
				z-index: 1;
			}
			#info a, #info button { pointer-events: auto; }
			#draw_element {
				width: 600px;
				background-color: #aaaaaa;
				color: #000000;
				font-family: sans-serif;
				font-size: 30px;
				line-height: 1.5;
				text-align: center;
				padding: 30px;
			}
			#draw_element img {
			  animation: swing 1s ease-in-out infinite alternate;
			}
			#draw_element input[type="text"] {
				font-size: 24px;
				padding: 8px 12px;
				border: 2px solid #888;
				border-radius: 6px;
				width: 80%;
				margin-top: 10px;
			}
			#draw_element button {
				font-size: 24px;
				padding: 8px 20px;
				margin-top: 10px;
				border: none;
				border-radius: 6px;
				background-color: #4CAF50;
				color: white;
				cursor: pointer;
			}
			#draw_element button:hover {
				background-color: #2196F3;
			}
			@keyframes swing {
				from { transform: rotate(-15deg); }
				to { transform: rotate(15deg); }
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js 0.164</a> - webgl - HTMLTexture (polyfilled by three-html-render)
		</div>

		<!-- three@0.164 predates the native HTMLTexture / InteractionManager. This
		     demo's importmap pins that version so three-html-render's fallback
		     paths run: HTMLTexture via captureElementImage, InteractionManager
		     ported from upstream. -->
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
					"three-html-render/polyfill": "https://cdn.jsdelivr.net/npm/three-html-render/dist/polyfill.mjs"
				}
			}
		</script>

		<script type="module">
			// Same user code as three-html.html on three.js 0.164.1, which
			// predates the native HTMLTexture. The package's HTMLTexture +
			// InteractionManager run via their fallback path.

			import * as THREE from 'three';
			import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
			import { installHtmlInCanvasPolyfill } from '/src/htmlInCanvasPolyfill.ts?v=legacy';
			import { HTMLTexture } from '/src/htmlTexture.ts?v=legacy';
			import { InteractionManager } from '/src/interactionManager.ts?v=legacy';

			if ( ! ( 'requestPaint' in HTMLCanvasElement.prototype ) ) {

				installHtmlInCanvasPolyfill();
				info.innerHTML += '<br><a href="https://github.com/WICG/html-in-canvas" target="_blank">HTML-in-Canvas API</a> not available. Using <a href="https://github.com/repalash/three-html-render" target="_blank">polyfill</a>.';

			}

			let camera, scene, renderer, mesh, interactions;

			init();

			function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.domElement.setAttribute( 'layoutsubtree', '' );      // CHANGED
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.z = 500;

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xaaaaaa );
				// RoomEnvironment isn't available on three.js 0.164, use plain lights.
				scene.add( new THREE.AmbientLight( 0xffffff, 5 ) );
				const dirLight = new THREE.DirectionalLight( 0xffffff, 5 );
				dirLight.position.set( 1, 1, 2 );
				scene.add( dirLight );

				// HTML element

				const element = document.createElement( 'div' );
				element.id = 'draw_element';
				element.innerHTML = `
					Hello world!<br>I'm multi-line, <b>formatted</b>,
					rotated text with emoji (&#128512;), RTL text
					<span dir=rtl>من فارسی صحبت میکنم</span>,
					vertical text,
					<p style="writing-mode: vertical-rl;">
					这是垂直文本
					</p>
					an inline image (<img width="150" src="assets/wolf.jpg">), and
					<svg width="50" height="50">
					<circle cx="25" cy="25" r="20" fill="green" />
					<text x="25" y="30" font-size="15" text-anchor="middle" fill="#fff">
						SVG
					</text>
					</svg>!
					<br>
					<input type="text" placeholder="Type here...">
					<button>Click me</button>
				`;
				renderer.domElement.appendChild( element );                   // CHANGED (fallback requires pre-append)

				const geometry = new RoundedBoxGeometry( 200, 200, 200, 10, 10 );

				const material = new THREE.MeshStandardMaterial( { roughness: 0, metalness: 0.5 } );
				material.map = new HTMLTexture( element );

				mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				// Interaction

				interactions = new InteractionManager();
				interactions.connect( renderer, camera );
				interactions.add( mesh );

				// Button click handler

				element.querySelector( 'button' ).addEventListener( 'click', function () {

					this.textContent = 'Clicked!';

				} );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate( time ) {

				mesh.rotation.x = Math.sin( time * 0.0005 ) * 0.5;
				mesh.rotation.y = Math.cos( time * 0.0008 ) * 0.5;

				interactions.update();

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
