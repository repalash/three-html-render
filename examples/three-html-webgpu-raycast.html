<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - materials - html texture (raycast interaction)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			/* three.js examples/main.css (inlined — not shipped in the npm package) */
			body {
				margin: 0;
				background-color: #ffffff;
				color: #fff;
				font-family: Monospace;
				font-size: 13px;
				line-height: 24px;
				overscroll-behavior: none;
			}
			a { color: #ff0; text-decoration: none; }
			a:hover { text-decoration: underline; }
			#info {
				position: absolute;
				top: 0px;
				width: 100%;
				padding: 10px;
				box-sizing: border-box;
				text-align: center;
				user-select: none;
				pointer-events: none;
				z-index: 1;
			}
			#info a, #info button { pointer-events: auto; }

			#draw_element {
				width: 600px;
				background-color: #aaaaaa;
				color: #000000;
				font-family: sans-serif;
				font-size: 30px;
				line-height: 1.5;
				text-align: center;
				padding: 30px;
			}
			#draw_element img {
			  animation: swing 1s ease-in-out infinite alternate;
			}
			#draw_element input[type="text"] {
				font-size: 24px;
				padding: 8px 12px;
				border: 2px solid #888;
				border-radius: 6px;
				width: 80%;
				margin-top: 10px;
			}
			#draw_element button {
				font-size: 24px;
				padding: 8px 20px;
				margin-top: 10px;
				border: none;
				border-radius: 6px;
				background-color: #4CAF50;
				color: white;
				cursor: pointer;
			}
			#draw_element button:hover {
				background-color: #2196F3;
			}
			@keyframes swing {
				from { transform: rotate(-15deg); }
				to { transform: rotate(15deg); }
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - webgpu - HTMLTexture — raycast interaction (all faces)
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
					"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
					"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
					"three-html-render/polyfill": "https://cdn.jsdelivr.net/npm/three-html-render/dist/polyfill.mjs",
					"three-html-render/raycast-interaction": "https://cdn.jsdelivr.net/npm/three-html-render/dist/raycastInteractionManager.js"
				}
			}
		</script>

		<script type="module">
			// WebGPU + raycast port of three.js's webgpu_materials_texture_html
			// example.

			import * as THREE from 'three/webgpu';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { installHtmlInCanvasPolyfill } from '/src/htmlInCanvasPolyfill.ts';
			import { RaycastInteractionManager } from '/src/raycastInteractionManager.ts';

			if ( ! ( 'requestPaint' in HTMLCanvasElement.prototype ) ) {

				installHtmlInCanvasPolyfill();
				info.innerHTML += '<br><a href="https://github.com/WICG/html-in-canvas" target="_blank">HTML-in-Canvas API</a> not available. Using <a href="https://github.com/repalash/three-html-render" target="_blank">polyfill</a>.';

			}

			let camera, scene, renderer, mesh, interactions, controls;

			init();

			async function init() {

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.domElement.setAttribute( 'layoutsubtree', '' );      // CHANGED
				await renderer.init();

				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.z = 500;

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xaaaaaa );
				scene.environment = new THREE.PMREMGenerator( renderer ).fromScene( new RoomEnvironment(), 0.02 ).texture;

				// HTML element

				const element = document.createElement( 'div' );
				element.id = 'draw_element';
				element.innerHTML = `
					Hello world!<br>I'm multi-line, <b>formatted</b>,
					rotated text with emoji (&#128512;), RTL text
					<span dir=rtl>من فارسی صحبت میکنم</span>,
					vertical text,
					<p style="writing-mode: vertical-rl;">
					这是垂直文本
					</p>
					an inline image (<img width="150" src="/examples/assets/wolf.jpg">), and
					<svg width="50" height="50">
					<circle cx="25" cy="25" r="20" fill="green" />
					<text x="25" y="30" font-size="15" text-anchor="middle" fill="#fff">
						SVG
					</text>
					</svg>!
					<br>
					<input type="text" placeholder="Type here...">
					<button>Click me</button>
				`;

				const geometry = new RoundedBoxGeometry( 200, 200, 200, 10, 10 );

				const material = new THREE.MeshStandardMaterial( { roughness: 0, metalness: 0.5 } );
				material.map = new THREE.HTMLTexture( element );

				mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				// Interaction                                                  CHANGED

				interactions = new RaycastInteractionManager();
				interactions.connect( renderer, camera );
				interactions.add( mesh );

				// Let OrbitControls handle pointerdowns that land on the bare
				// canvas / polyfill host (empty background), but block it for
				// anything landing on a real DOM element. OrbitControls's
				// setPointerCapture would otherwise redirect the subsequent
				// pointerup and break native click / selection / image-drag.
				// Must run BEFORE OrbitControls' own bubble-phase handler.    CHANGED
				const canvasEl = renderer.domElement;
				canvasEl.addEventListener( 'pointerdown', ( e ) => {
					const t = e.target;
					const onBackground = t === canvasEl || ( t.hasAttribute && t.hasAttribute( 'data-html-in-canvas-host' ) );
					if ( ! onBackground ) e.stopImmediatePropagation();
				} );

				// OrbitControls for user-driven rotation.                      CHANGED
				controls = new OrbitControls( camera, renderer.domElement );
				controls.enablePan = false;
				controls.enableDamping = true;

				// Button click handler

				element.querySelector( 'button' ).addEventListener( 'click', function () {

					this.textContent = 'Clicked!';

				} );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();                                             // CHANGED
				renderer.domElement.requestPaint();                            // CHANGED (for CSS animations)
				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
