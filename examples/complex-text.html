<!doctype html>
<meta charset="utf-8" />
<title>Demo of complex text in canvas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

<style>
  html, body { font-family: 'Inter', sans-serif; }
  canvas {
    border: 1px solid blue;
    width: 638px;
    height: 318px;
  }
</style>

<canvas id="canvas" layoutsubtree="true">
  <div id="draw_element" style="width: 550px;">
    Hello from <a href="https://github.com/WICG/html-in-canvas">html-in-canvas</a>!
    <br>I'm multi-line, <b>formatted</b>,
    rotated text with emoji (), RTL text
    <span dir=rtl>من فارسی صحبت میکنم</span>,
    vertical text,
    <p style="writing-mode: vertical-rl;">
      这是垂直文本
    </p>
    an inline image (<img width="150" src="./assets/wolf.jpg">), and
    <svg width="50" height="50">
      <circle cx="25" cy="25" r="20" fill="green" />
      <text x="25" y="30" font-size="15" text-anchor="middle" fill="#fff">
        SVG
      </text>
    </svg>!
  </div>
</canvas>

<script type="module">
  import { installHtmlInCanvasPolyfill } from '/src/htmlInCanvasPolyfill.ts';
  installHtmlInCanvasPolyfill();

  const canvas = document.getElementById('canvas');
  const draw_element = document.getElementById('draw_element');
  const ctx = canvas.getContext('2d');
  canvas.onpaint = (event) => {
    ctx.reset();
    ctx.rotate((15 * Math.PI) / 180);
    ctx.translate(80 * devicePixelRatio, -20 * devicePixelRatio);
    let transform = ctx.drawElementImage(draw_element, 0, 0);
    draw_element.style.transform = transform.toString();
  };
  canvas.requestPaint();

  const observer = new ResizeObserver(([entry]) => {
    if (entry.devicePixelContentBoxSize && entry.devicePixelContentBoxSize[0]) {
      canvas.width = entry.devicePixelContentBoxSize[0].inlineSize;
      canvas.height = entry.devicePixelContentBoxSize[0].blockSize;
    } else {
      const b = entry.contentBoxSize[0];
      canvas.width = Math.round(b.inlineSize * devicePixelRatio);
      canvas.height = Math.round(b.blockSize * devicePixelRatio);
    }
  });
  observer.observe(canvas);
</script>
