<!doctype html>
<meta charset="utf-8" />
<title>WebGL + interactive form on cube faces</title>

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
  integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
  crossorigin="anonymous"></script>
<script src="/examples/assets/webGLSetup.js"></script>

<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas {
    border: 1px solid blue;
    width: 90vw;
    aspect-ratio: 2 / 1;
  }
  #draw_element, .face-clone {
    width: 400px;
    height: 400px;
    padding: 10px;
  }
  form p { margin: 6px; }
</style>

<canvas id="gl-canvas" layoutsubtree="true">
  <div id="draw_element">
    <form id="demo-form" action="#" method="get">
      <fieldset>
        <legend>Spaceship Control Panel</legend>
        <p>
          <label for="shipName">Ship Name:</label>
          <input type="text" id="shipName" value="The 'Canvas' Voyager">
        </p>
        <p>
          <input type="checkbox" id="hyperdrive" checked>
          <label for="hyperdrive">Engage Hyperdrive</label>
        </p>
        <fieldset>
          <legend>Target System</legend>
          <p>
            <input type="radio" id="alpha" name="system" value="alpha" checked>
            <label for="alpha">Alpha Centauri</label>
          </p>
          <p>
            <input type="radio" id="beta" name="system" value="beta">
            <label for="beta">Betelgeuse</label>
          </p>
        </fieldset>
        <p>
          <label for="shieldLevel">Shield Strength:</label>
          <input type="range" id="shieldLevel" min="0" max="100" value="75">
        </p>
        <p>
          <label for="fuelType">Fuel Type:</label>
          <select id="fuelType">
            <option value="plasma">Plasma</option>
            <option value="antimatter" selected>Antimatter</option>
            <option value="dark-energy">Dark Energy</option>
          </select>
        </p>
        <p style="text-align: right; margin: 0;">
          <button type="submit">Launch!</button>
        </p>
      </fieldset>
    </form>
  </div>
</canvas>

<script type="module">
  import { Matrix4, Vector3 } from 'three';
  import { syncFormState } from '/src/syncFormState.ts';

  import { installHtmlInCanvasPolyfill } from '/src/htmlInCanvasPolyfill.ts';
  installHtmlInCanvasPolyfill();

  const CUBE_ROTATION = 1;
  const PI = Math.PI;
  let render_context = null;

  // Face definitions: local normal direction and rotation to orient the face
  const FACE_DEFS = [
    { name: 'front',  faceRotation: new Matrix4() },
    { name: 'back',   faceRotation: new Matrix4().makeRotationY(PI) },
    { name: 'right',  faceRotation: new Matrix4().makeRotationY(PI / 2) },
    { name: 'left',   faceRotation: new Matrix4().makeRotationY(-PI / 2) },
    { name: 'top',    faceRotation: new Matrix4().makeRotationX(-PI / 2) },
    { name: 'bottom', faceRotation: new Matrix4().makeRotationX(PI / 2) },
  ];

  function loadTexture(gl) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texElementImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, window.draw_element);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return texture;
  }

  function render() {
    if (!render_context) return;
    drawScene(render_context.gl, render_context.program, render_context.buffers,
              render_context.texture, CUBE_ROTATION);
    updateOverlays();
    requestAnimationFrame(render);
  }

  const _viewport = new Matrix4();
  const _pixelToLocal = new Matrix4();
  const _mvp = new Matrix4();
  const _camDir = new Vector3(0, 0, -1);
  const _faceNormal = new Vector3();

  const canvas = document.querySelector('#gl-canvas');
  const elem = document.getElementById('draw_element');
  const faceElements = [];

  // Build cube modelView (same as drawScene)
  const cubeModelView = new Matrix4();
  cubeModelView.makeTranslation(0, 0, -6);
  cubeModelView.multiply(new Matrix4().makeRotationZ(CUBE_ROTATION));
  cubeModelView.multiply(new Matrix4().makeRotationY(CUBE_ROTATION * 0.7));
  cubeModelView.multiply(new Matrix4().makeRotationX(CUBE_ROTATION * 0.3));

  // Build projection (same as drawScene)
  const fov = (35 * PI) / 180;
  let projectionMatrix = new Matrix4();

  function syncToOriginal(clone) {
    const srcFields = clone.querySelectorAll('input, textarea, select');
    const dstFields = elem.querySelectorAll('input, textarea, select');
    for (let i = 0; i < srcFields.length && i < dstFields.length; i++) {
      const s = srcFields[i], d = dstFields[i];
      if (s.type === 'checkbox' || s.type === 'radio') d.checked = s.checked;
      else if (s.tagName === 'SELECT') d.selectedIndex = s.selectedIndex;
      else d.value = s.value;
    }
  }

  function syncFromOriginal() {
    for (const clone of faceElements) {
      if (clone === elem) continue;
      syncFormState(elem, clone);
    }
  }

  // Append clones to the host (polyfill) or canvas (native)
  const host = document.querySelector('[data-html-in-canvas-host]') || canvas;

  // Create 6 face elements (original + 5 clones)
  for (let i = 0; i < FACE_DEFS.length; i++) {
    const el = i === 0 ? elem : elem.cloneNode(true);
    if (i > 0) {
      el.removeAttribute('id');
      el.classList.add('face-clone');
      host.appendChild(el);
    }
    el.style.opacity = '0.4';
    el.style.pointerEvents = 'auto';

    el.addEventListener('input', () => {
      if (el !== elem) syncToOriginal(el);
      syncFromOriginal();
      canvas.requestPaint();
    }, true);
    el.addEventListener('change', () => {
      if (el !== elem) syncToOriginal(el);
      syncFromOriginal();
      canvas.requestPaint();
    }, true);

    faceElements.push(el);
  }

  function updateOverlays() {
    const cssW = canvas.clientWidth;
    const cssH = canvas.clientHeight;
    const aspect = cssW / cssH;

    _viewport.set(
      cssW / 2, 0, 0, cssW / 2,
      0, -cssH / 2, 0, cssH / 2,
      0, 0, 1, 0,
      0, 0, 0, 1
    );

    projectionMatrix.makePerspective(
      -aspect * Math.tan(fov / 2) * 0.1, aspect * Math.tan(fov / 2) * 0.1,
      Math.tan(fov / 2) * 0.1, -Math.tan(fov / 2) * 0.1,
      0.1, 100
    );

    for (let i = 0; i < FACE_DEFS.length; i++) {
      const el = faceElements[i];
      const face = FACE_DEFS[i];

      const elemW = el.offsetWidth;
      const elemH = el.offsetHeight;
      if (elemW <= 0 || elemH <= 0) continue;

      // pixelToLocal: maps element pixels to local face coords on the front face (z=1)
      _pixelToLocal.set(
        -2 / elemW, 0, 0, 1,
        0, 2 / elemH, 0, -1,
        0, 0, 1, 1,
        0, 0, 0, 1
      );

      // faceModelView = cubeModelView × faceRotation
      const faceModelView = cubeModelView.clone().multiply(face.faceRotation);

      // MVP = projection × faceModelView × pixelToLocal
      _mvp.multiplyMatrices(projectionMatrix, faceModelView);
      _mvp.multiply(_pixelToLocal);
      _mvp.premultiply(_viewport);

      // Backface culling: strip translation, transform normal, check Z
      const rotOnly = faceModelView.clone().setPosition(0, 0, 0);
      _faceNormal.set(0, 0, 1).applyMatrix4(rotOnly);
      const frontFacing = _faceNormal.z > 0;

      el.style.position = 'absolute';
      el.style.left = '0';
      el.style.top = '0';
      el.style.transformOrigin = '0 0';
      el.style.pointerEvents = frontFacing ? 'auto' : 'none';
      el.style.display = frontFacing ? '' : 'none';
      el.style.transform = 'matrix3d(' + _mvp.elements.join(',') + ')';
    }
  }

  function main() {
    const gl = canvas.getContext('webgl2');
    if (!gl) return;

    const vsSource = `
      attribute vec4 aVertexPosition;
      attribute vec2 aTextureCoord;
      uniform mat4 uModelViewMatrix;
      uniform mat4 uProjectionMatrix;
      varying highp vec2 vTextureCoord;
      void main(void) {
        gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
        vTextureCoord = aTextureCoord;
      }
    `;
    const fsSource = `
      varying highp vec2 vTextureCoord;
      uniform sampler2D uSampler;
      void main(void) {
        gl_FragColor = texture2D(uSampler, vTextureCoord);
      }
    `;

    const shaderProgram = initShaderProgram(gl, vsSource, fsSource);
    const programInfo = {
      program: shaderProgram,
      attribLocations: {
        vertexPosition: gl.getAttribLocation(shaderProgram, 'aVertexPosition'),
        textureCoord: gl.getAttribLocation(shaderProgram, 'aTextureCoord'),
      },
      uniformLocations: {
        projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'),
        modelViewMatrix: gl.getUniformLocation(shaderProgram, 'uModelViewMatrix'),
        uSampler: gl.getUniformLocation(shaderProgram, 'uSampler'),
      },
    };

    const buffers = initBuffers(gl);
    const texture = loadTexture(gl);
    const isFirst = !render_context;
    render_context = {gl, program: programInfo, buffers, texture};
    if (isFirst) requestAnimationFrame(render);
  }

  canvas.onpaint = () => {
    if (!render_context) {
      main();
      return;
    }
    const {gl} = render_context;
    gl.deleteTexture(render_context.texture);
    const newTex = loadTexture(gl);
    render_context.texture = newTex;
  };
  canvas.requestPaint();

  const observer = new ResizeObserver(([entry]) => {
    if (entry.devicePixelContentBoxSize && entry.devicePixelContentBoxSize[0]) {
      canvas.width = entry.devicePixelContentBoxSize[0].inlineSize;
      canvas.height = entry.devicePixelContentBoxSize[0].blockSize;
    } else {
      const b = entry.contentBoxSize[0];
      canvas.width = Math.round(b.inlineSize * devicePixelRatio);
      canvas.height = Math.round(b.blockSize * devicePixelRatio);
    }
  });
  observer.observe(canvas);
</script>
