<script type="module">
const canvas = document.getElementById('canvas');
const formCard = document.getElementById('formCard');
const gl = canvas.getContext('webgl2', { alpha: false });

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function link(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}

const VS = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main() {
  v_uv = vec2(a_pos.x * 0.5 + 0.5, 0.5 - a_pos.y * 0.5);
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_form;
uniform vec2 u_resolution;
uniform float u_time;

uniform vec2 u_focusPos;
uniform vec2 u_focusSize;
uniform float u_focusActive;
uniform float u_focusRadius;
uniform vec2 u_mouse; // cursor in UV space

float sdRoundBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i), hash(i + vec2(1, 0)), f.x),
    mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x),
    f.y
  );
}

void main() {
  vec2 uv = v_uv;
  vec4 form = texture(u_form, uv);

  // ── Background: dark with subtle dot grid ──
  vec3 bgColor = vec3(0.067); // #111

  // Dot grid pattern — like the CF site
  vec2 pxCoord = uv * u_resolution;
  float dotSpacing = 14.0;
  vec2 gridPos = mod(pxCoord, dotSpacing);
  float dotDist = length(gridPos - dotSpacing * 0.5);
  float dotVal = 1.0 - smoothstep(0.6, 1.0, dotDist);
  bgColor += dotVal * 0.04; // light dots on dark bg

  // ── Cursor illumination on dots ──
  float cursorDist = length((uv - u_mouse) * vec2(u_resolution.x / u_resolution.y, 1.0));
  float cursorLight = exp(-cursorDist * cursorDist * 12.0) * 0.12;
  bgColor += dotVal * cursorLight * vec3(1.0, 0.85, 0.6);

  // ── Build glow on the background FIRST, then composite form on top ──
  vec3 color = bgColor;

  // ── Focus glow (rendered onto bg, before form) ──
  if (u_focusActive > 0.01) {
    vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
    vec2 p = (uv - u_focusPos) * aspect;
    vec2 sz = u_focusSize * aspect;
    float r = u_focusRadius * aspect.x;

    float d = sdRoundBox(p, sz, r);
    float pxScale = u_resolution.y;
    float dPx = d * pxScale;

    // ── Cloudflare orange palette ──
    vec3 coreOrange  = vec3(0.965, 0.510, 0.122);  // #f6821f
    vec3 goldenAmber = vec3(0.984, 0.678, 0.255);  // #fbad41
    vec3 hotOrange   = vec3(1.000, 0.400, 0.200);  // #ff6633
    vec3 deepEmber   = vec3(0.800, 0.300, 0.080);  // deep warm

    // Animated color — faster, more movement along perimeter
    float angle = atan(p.y, p.x);
    float phase = angle + u_time * 1.6;

    float t1 = sin(phase) * 0.5 + 0.5;
    float t2 = sin(phase * 1.3 + 2.0) * 0.5 + 0.5;
    float t3 = sin(phase * 0.5 - u_time * 0.7) * 0.5 + 0.5;
    vec3 glowColor = mix(coreOrange, goldenAmber, t1);
    glowColor = mix(glowColor, hotOrange, t2 * 0.4);
    glowColor = mix(glowColor, goldenAmber, t3 * 0.2);

    // Animated shimmer — more visible, moves faster
    float shimmer = noise(uv * 40.0 + u_time * 1.2) * 0.3 + 0.85;
    shimmer += noise(uv * 80.0 - u_time * 0.9) * 0.15;

    // ── Glow layers — bigger, brighter ──
    float atmoGlow = smoothstep(100.0, 0.0, dPx) * 0.08;
    float outerGlow = smoothstep(50.0, 0.0, dPx) * 0.25;
    float midGlow = smoothstep(20.0, 0.0, dPx) * 0.4;
    float ring = smoothstep(3.0, 0.3, abs(dPx)) * 0.85;

    float totalGlow = (atmoGlow + outerGlow + midGlow + ring) * u_focusActive * shimmer;

    vec3 outerColor = deepEmber * 0.8;
    vec3 innerColor = glowColor;
    float mixT = smoothstep(40.0, 0.0, dPx);
    vec3 finalGlow = mix(outerColor, innerColor, mixT);

    // Additive glow onto background
    color += finalGlow * totalGlow;

    // Warm light cast on dots — wider, stronger
    float dotWarmth = smoothstep(80.0, 0.0, dPx) * dotVal * 0.7 * u_focusActive;
    color += coreOrange * dotWarmth;
  }

  // ── Fade unfocused borders: distant fields' borders dim toward invisible ──
  vec3 formColor = form.rgb;
  if (u_focusActive > 0.01) {
    vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
    vec2 p = (uv - u_focusPos) * aspect;
    vec2 sz = u_focusSize * aspect;
    float r = u_focusRadius * aspect.x;
    float d = sdRoundBox(p, sz, r);
    float dPx2 = d * u_resolution.y;

    // How far from the focused element (0 = close, 1 = far)
    float farness = smoothstep(30.0, 150.0, dPx2) * u_focusActive;

    // Detect border pixels: they're brighter than the dark bg (#1a1a1a)
    // but dimmer than text. Borders are ~rgba(255,255,255,0.1) = ~0.077 lum
    float lum = dot(formColor, vec3(0.2126, 0.7152, 0.0722));
    float isBorder = smoothstep(0.05, 0.09, lum) * (1.0 - smoothstep(0.09, 0.15, lum));

    // Dim borders toward the background color
    formColor = mix(formColor, vec3(0.067), farness * isBorder * 0.8);
  }

  // ── Composite form on TOP of the glowing background ──
  color = mix(color, formColor, form.a);

  fragColor = vec4(color, 1.0);
}`;

const prog = link(VS, FS);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

gl.useProgram(prog);
const U = {};
['u_form','u_resolution','u_time','u_focusPos','u_focusSize','u_focusActive','u_focusRadius','u_mouse']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

// ─── Focus tracking with spring physics ───
const focus = {
  cx: 0.5, cy: 0.3, hw: 0.3, hh: 0.03, active: 0, radius: 0.01,
  tx: 0.5, ty: 0.3, thw: 0.3, thh: 0.03, tactive: 0, tradius: 0.01,
  vx: 0, vy: 0, vw: 0, vh: 0, vr: 0,
};

let mouseUV = [0.5, 0.5];
canvas.addEventListener('mousemove', (e) => {
  const r = canvas.getBoundingClientRect();
  mouseUV = [
    (e.clientX - r.left) / r.width,
    (e.clientY - r.top) / r.height
  ];
});

const SPRING = 0.18;
const DAMP = 0.65;
let hasHadFirstFocus = false;

function springStep() {
  focus.vx += (focus.tx - focus.cx) * SPRING;
  focus.vy += (focus.ty - focus.cy) * SPRING;
  focus.vw += (focus.thw - focus.hw) * SPRING;
  focus.vh += (focus.thh - focus.hh) * SPRING;
  focus.vr += (focus.tradius - focus.radius) * SPRING;

  focus.vx *= DAMP; focus.vy *= DAMP;
  focus.vw *= DAMP; focus.vh *= DAMP;
  focus.vr *= DAMP;

  focus.cx += focus.vx; focus.cy += focus.vy;
  focus.hw += focus.vw; focus.hh += focus.vh;
  focus.radius += focus.vr;

  focus.active += (focus.tactive - focus.active) * 0.12;
}

function updateFocusTarget(el) {
  if (!el) { focus.tactive = 0; return; }

  const cRect = canvas.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();

  // Use the canvas backing-to-CSS ratio so positions stay correct at any DPR
  const scaleX = canvas.width / cRect.width;
  const scaleY = canvas.height / cRect.height;

  // Element center in canvas backing pixels
  const cx = ((eRect.left + eRect.right) / 2 - cRect.left) * scaleX;
  const cy = ((eRect.top + eRect.bottom) / 2 - cRect.top) * scaleY;
  const pad = 5;
  const hw = (eRect.width / 2 + pad) * scaleX;
  const hh = (eRect.height / 2 + pad) * scaleY;

  // Convert to UV (0–1)
  focus.tx = cx / canvas.width;
  focus.ty = cy / canvas.height;
  focus.thw = hw / canvas.width;
  focus.thh = hh / canvas.height;
  focus.tactive = 1;
  focus.tradius = (8 * scaleX) / canvas.width;

  // First focus: snap to position instantly, don't spring from nowhere
  if (!hasHadFirstFocus) {
    hasHadFirstFocus = true;
    focus.cx = focus.tx;
    focus.cy = focus.ty;
    focus.hw = focus.thw;
    focus.hh = focus.thh;
    focus.radius = focus.tradius;
    focus.vx = focus.vy = focus.vw = focus.vh = focus.vr = 0;
  }
}

const focusables = document.querySelectorAll('.focusable');
focusables.forEach(el => {
  // For wrapper elements (like input-suffix), listen for focusin/focusout
  // so the glow targets the wrapper, not the inner input
  const isWrapper = el.tagName !== 'INPUT' && el.tagName !== 'SELECT' && el.tagName !== 'BUTTON';
  if (isWrapper) {
    el.addEventListener('focusin', () => updateFocusTarget(el));
    el.addEventListener('focusout', (e) => {
      // Only deactivate if focus left the wrapper entirely
      requestAnimationFrame(() => {
        if (!el.contains(document.activeElement)) {
          const a = document.activeElement;
          if (!a || !a.closest('.focusable')) focus.tactive = 0;
        }
      });
    });
  } else {
    el.addEventListener('focus', () => updateFocusTarget(el));
    el.addEventListener('blur', () => {
      requestAnimationFrame(() => {
        const a = document.activeElement;
        if (!a || !a.closest('.focusable')) focus.tactive = 0;
      });
    });
  }
});

canvas.onpaint = () => {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texElementImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, formCard);
};

const t0 = performance.now();
function render() {
  const time = (performance.now() - t0) / 1000;
  springStep();

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(prog);
  gl.bindVertexArray(vao);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U.u_form, 0);

  gl.uniform2f(U.u_resolution, canvas.width, canvas.height);
  gl.uniform1f(U.u_time, time);
  gl.uniform2f(U.u_focusPos, focus.cx, focus.cy);
  gl.uniform2f(U.u_focusSize, focus.hw, focus.hh);
  gl.uniform1f(U.u_focusActive, focus.active);
  gl.uniform1f(U.u_focusRadius, focus.radius);
  gl.uniform2f(U.u_mouse, mouseUV[0], mouseUV[1]);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // canvas.requestPaint();
  requestAnimationFrame(render);
}

canvas.requestPaint();
requestAnimationFrame(render);

const obs = new ResizeObserver(([entry]) => {
  const dpr = entry.devicePixelContentBoxSize;
  if (dpr) {
    canvas.width = dpr[0].inlineSize;
    canvas.height = dpr[0].blockSize;
  }
});
obs.observe(canvas, { box: 'device-pixel-content-box' });
</script>
</body>
</html>
